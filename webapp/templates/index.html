<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVEN Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; line-height: 1.45; }
      textarea { width: 100%; height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      label { display: inline-block; margin-right: 8px; }
      pre { background: #0f172a; color: #e2e8f0; padding: 12px; overflow-x: auto; border-radius: 6px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .row { margin: 8px 0; }
      button { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
      input[type=number] { width: 88px; }
    </style>
  </head>
  <body>
    <h1>SVEN: Secure vs Vulnerable Generation</h1>
    <p>Enter a code prompt. The model will generate with secure and vulnerable prefixes so you can compare.</p>

    <div class="row">
      <label for="prompt">Prompt</label>
      <textarea id="prompt">def connect(user_input):
    pass</textarea>
    </div>

    <div class="row">
      <label for="maxlen">Max length</label>
      <input id="maxlen" type="number" value="64" min="8" max="256" />
      <label for="temp">Temperature</label>
      <input id="temp" type="number" step="0.1" value="0.8" min="0.1" max="1.5" />
      <button id="go">Generate</button>
    </div>

    <div class="cols" style="margin-top: 16px;">
      <div>
        <h3>Secure</h3>
        <pre id="secure">(waiting)</pre>
      </div>
      <div>
        <h3>Vulnerable</h3>
        <pre id="vulnerable">(waiting)</pre>
      </div>
    </div>

    <script>
      async function generate() {
        const prompt = document.getElementById('prompt').value;
        const max_length = parseInt(document.getElementById('maxlen').value || '64', 10);
        const temperature = parseFloat(document.getElementById('temp').value || '0.8');
        document.getElementById('secure').textContent = 'Generating...';
        document.getElementById('vulnerable').textContent = 'Generating...';
        try {
          const res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ prompt, max_length, temperature, mode: 'both' })
          });
          const data = await res.json();
          if (data.error) {
            document.getElementById('secure').textContent = 'Error: ' + data.error;
            document.getElementById('vulnerable').textContent = 'Error: ' + data.error;
          } else {
            document.getElementById('secure').textContent = (data.secure || '').trim();
            document.getElementById('vulnerable').textContent = (data.vulnerable || '').trim();
          }
        } catch (e) {
          document.getElementById('secure').textContent = 'Error: ' + e;
          document.getElementById('vulnerable').textContent = 'Error: ' + e;
        }
      }
      document.getElementById('go').addEventListener('click', generate);
    </script>
  </body>
  </html>
